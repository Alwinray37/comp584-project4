<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Calculator App</title>
    
    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="/style.css">
    <script src="script.js" defer></script>
 
  </head>  
  <body>
    <div class="wrapper">
        <section class="calculator-screen">
          <!-- calc screen -->
           0
          <!-- <input id="calc-scrn" type="number" placeholder="0"> -->
        </section>
    
        <section class="calculator-buttons">
          <div class="extra-buttons">
            <button id="clear-btn" type="button">C</button>
            <button id="delete-btn" type="button">back</button>
          </div>
          <div class="numbers">
            
          </div>
          <div class="operations">
            <button id="add-btn" type="button">+</button>
            <button id="subtract-btn" type="button">-</button>
            <button id="divide-btn" type="button">&divide;</button>
            <button id="multiply-btn" type="button">&times;</button>
            <button id="equals-btn" type="button">=</button>
          </div>
        </section>
    </div>
  </body>
</html>
